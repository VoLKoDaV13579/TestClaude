<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav>
        <div class="container">
            <h1>FinApp</h1>
            <div>
                <span style="margin-right: 1rem; color: #666;">{{ .user.FullName }}</span>
                <a href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2>My Accounts</h2>
                <button class="btn" onclick="openModal()">+ New Account</button>
            </div>

            {{ if not .accounts }}
            <div style="text-align: center; padding: 3rem; color: #666;">
                <p>No accounts yet. Create your first account to get started!</p>
            </div>
            {{ else }}
            <div class="account-grid">
                {{ range .accounts }}
                <div class="account-card">
                    <h3>{{ .Name }}</h3>
                    <div class="balance">{{ printf "%.2f" .Balance }}</div>
                    <div class="currency">{{ .Currency }}</div>
                    <div class="account-actions">
                        <button onclick="deleteAccount({{ .ID }})">Delete</button>
                    </div>
                </div>
                {{ end }}
            </div>
            {{ end }}
        </div>
    </div>

    <!-- Modal for creating new account -->
    <div id="accountModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create New Account</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="accountForm">
                <div class="form-group">
                    <label for="name">Account Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="currency">Currency</label>
                    <select id="currency" name="currency" required>
                        <option value="USD">USD - US Dollar</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound</option>
                        <option value="RUB">RUB - Russian Ruble</option>
                    </select>
                </div>

                <button type="submit" class="btn" style="width: 100%;">Create Account</button>
            </form>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('accountModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('accountModal').classList.remove('active');
        }

        document.getElementById('accountForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                name: document.getElementById('name').value,
                currency: document.getElementById('currency').value
            };

            try {
                const response = await fetch('/api/accounts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('Failed to create account');
                }
            } catch (error) {
                alert('Error creating account');
            }
        });

        async function deleteAccount(id) {
            if (!confirm('Are you sure you want to delete this account?')) {
                return;
            }

            try {
                const response = await fetch(`/api/accounts/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('Failed to delete account');
                }
            } catch (error) {
                alert('Error deleting account');
            }
        }
    </script>
</body>
</html>
