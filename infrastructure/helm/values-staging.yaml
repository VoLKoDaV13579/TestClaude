# Staging overrides

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false

env:
  APP_ENV: staging
  APP_DEBUG: "true"
  APP_URL: "https://staging.example.com"
  LOG_LEVEL: debug

ingress:
  hosts:
    - host: staging.example.com
      paths:
        - path: /
          pathType: Prefix
